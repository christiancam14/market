<section class="bg-azul-900 text-white py-10">
  <div
    class="container mx-auto max-w-5xl p-6 lg:p-8 rounded-lg text-center bg-azul-700"
  >
    <form
      (ngSubmit)="onSubmit($event)"
      #productForm="ngForm"
      class="p-4 rounded-lg shadow-lg"
    >
      <h2 class="!text-2xl !font-bold !mb-4">Crear Producto</h2>

      <div class="mb-4">
        <label for="name" class="block text-sm font-semibold mb-2"
          >Nombre del producto</label
        >
        <input
          type="text"
          id="name"
          [(ngModel)]="product.name"
          name="name"
          class="w-full p-2 border border-gray-300 rounded"
          required
        />
      </div>

      <div class="mb-4">
        <label for="price" class="block text-sm font-semibold mb-2"
          >Precio</label
        >
        <input
          type="number"
          id="price"
          [(ngModel)]="product.price"
          name="price"
          step="0.01"
          class="w-full p-2 border border-gray-300 rounded"
          required
        />
      </div>

      <div class="mb-4">
        <label for="imageUrl" class="block text-sm font-semibold mb-2"
          >URL de la imagen</label
        >
        <input
          type="url"
          id="imageUrl"
          [(ngModel)]="product.imageUrl"
          name="imageUrl"
          class="w-full p-2 border border-gray-300 rounded"
          required
        />
      </div>

      <div class="mb-4">
        <label for="description" class="block text-sm font-semibold mb-2"
          >Descripción</label
        >
        <textarea
          id="description"
          [(ngModel)]="product.description"
          name="description"
          rows="3"
          class="w-full p-2 border border-gray-300 rounded"
          required
        ></textarea>
      </div>

      <div class="mb-4">
        <label for="category" class="block text-sm font-semibold mb-2"
          >Categoría</label
        >
        <input
          type="text"
          id="category"
          [(ngModel)]="product.category"
          name="category"
          class="w-full p-2 border border-gray-300 rounded"
          required
        />
      </div>

      <div class="mt-4">
        <button
          type="submit"
          class="w-full py-2 px-4 text-white bg-azul-900 hover:bg-azul-600 rounded font-semibold"
        >
          Crear Producto
        </button>
      </div>
    </form>
  </div>
</section>
